name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 LTS
          - { python-version: "3.10", django-version: "5.2" }
          - { python-version: "3.11", django-version: "5.2" }
          - { python-version: "3.12", django-version: "5.2" }
          - { python-version: "3.13", django-version: "5.2" }
          - { python-version: "3.14", django-version: "5.2" }
          # Django 6.0
          - { python-version: "3.12", django-version: "6.0" }
          - { python-version: "3.13", django-version: "6.0" }
          - { python-version: "3.14", django-version: "6.0" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python
        env:
          PY: ${{ matrix.python-version }}
        run: uv python install "$PY"

      - name: Install dependencies
        env:
          DJANGO_VER: ${{ matrix.django-version }}
        run: |
          uv sync --all-extras
          uv pip install "django~=${DJANGO_VER}.0"

      - name: Compile library translations
        run: |
          find src/first_run_wizard -name '*.mo' -delete
          cd src/first_run_wizard && uv run django-admin compilemessages

      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

  example-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compile translations (library + example)
        run: |
          find src/first_run_wizard example -name '*.mo' -delete
          (cd src/first_run_wizard && uv run django-admin compilemessages)
          (cd example && uv run python manage.py compilemessages)

      - name: Django check on example project
        working-directory: example
        run: |
          uv run python manage.py check
          uv run python manage.py migrate --run-syncdb --no-input

  translations:
    # Re-extracts the library and example .po catalogs from source and
    # fails if either drifted (new strings unwrapped, removed strings still
    # in catalog, or — most importantly — strings from the wrong tree
    # leaking into the other catalog).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Re-extract library catalog
        working-directory: src/first_run_wizard
        run: uv run django-admin makemessages -l pl --no-location

      - name: Re-extract example catalog
        working-directory: example
        run: uv run python manage.py makemessages -l pl --no-location

      - name: Fail if any catalog drifted
        # POT-Creation-Date is bumped on every makemessages run; the -I
        # flag tells git diff to ignore hunks whose every changed line
        # matches that regex, so date-only churn does not trigger a fail.
        run: |
          if ! git diff -I 'POT-Creation-Date' --exit-code -- '**/locale/**/*.po'; then
            echo "::error::Translation catalogs drifted from source strings."
            echo "::error::Run the makemessages commands shown above locally and commit the .po updates."
            exit 1
          fi
