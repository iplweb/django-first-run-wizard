[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-first-run-wizard"
version = "0.1.1"
description = "Pluggable first-run setup wizard for Django: gets a fresh install through admin creation and any project-specific configuration steps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Michał Pasternak", email = "michal.dtz@gmail.com"},
]
keywords = ["django", "setup", "wizard", "first-run", "install", "onboarding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=5.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
]
dev = [
    "pre-commit",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage   = "https://github.com/iplweb/django-first-run-wizard"
Repository = "https://github.com/iplweb/django-first-run-wizard"
Issues     = "https://github.com/iplweb/django-first-run-wizard/issues"
Changelog  = "https://github.com/iplweb/django-first-run-wizard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
first_run_wizard = [
    "templates/**/*",
    "locale/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["first_run_wizard"]
known-local-folder = ["example_project", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-ra --ds=tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
